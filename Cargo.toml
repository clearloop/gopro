[package]
name = "gopro-dl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Bulk-download your GoPro cloud (GoPro Plus / Premium) media library to local disk"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
futures-util = "0.3"
indicatif = "0.17"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "stream", "rustls-tls", "http2", "charset"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util"] }

[profile.release]
opt-level = 2
